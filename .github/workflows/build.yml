name: build-norton-core-518

on:
  workflow_dispatch:
  push:

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 330

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 腾出磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -a -f || true
          df -h /

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-distutils rsync unzip zlib1g-dev file wget \
            libelf-dev

      - name: 编译
        run: |
          set -o pipefail
          bash build.sh 2>&1 | tee build.log

      - name: 失败时把日志尾部发到 Issue（公开可读）
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('build.log', 'utf8'); } catch (e) { log = '(build.log 不存在: ' + e.message + ')'; }
            const lines = log.split('\n');
            const tail = lines.slice(-350).join('\n');
            const body = [
              '构建失败。运行: ' + context.runId,
              '',
              '```',
              tail.replace(/```/g, "'''"),
              '```'
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'CI 失败日志 ' + context.runId,
              body: body.slice(0, 60000)
            });

      - name: 收集产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: norton-core-518-images
          if-no-files-found: warn
          retention-days: 14
          path: |
            build.log
            out/**/*.img
            out/**/*.itb
            out/**/*.squashfs
            out/*.txt
            openwrt/bin/targets/ipq806x/generic/*.bin
            openwrt/bin/targets/ipq806x/generic/*.itb
            openwrt/bin/targets/ipq806x/generic/*.manifest
            openwrt/bin/targets/ipq806x/generic/*.json
